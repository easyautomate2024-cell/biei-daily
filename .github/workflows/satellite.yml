name: 衛星画像の自動更新

on:
  schedule:
    - cron: "20 0 * * *"   # 毎日 09:20 JST
  workflow_dispatch: {}     # 手動実行も可

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      # 画像本体(COG)の読み込みも一時的な通信エラーで落ちないように
      GDAL_HTTP_MAX_RETRY: "3"
      GDAL_HTTP_RETRY_DELAY: "5"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存ライブラリ
        run: pip install --quiet rasterio pillow numpy

      - name: 衛星画像を更新
        run: python scripts/update_satellite.py

      # 池の記録は補助的なデータ。ここで失敗しても衛星画像の更新は止めない
      - name: 青い池の状態を記録
        continue-on-error: true
        run: python scripts/update_pond.py

      - name: 変更があればコミット
        run: |
          git add photos/sat data/satellite.json data/pond_color.json
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            MSG=$(python -c "import json; m=json.load(open('data/satellite.json')); print(f\"衛星データ更新: {m['date']}の画像を掲載中（確認 {m['checked_at'][:10]}）\")")
            git config user.name "biei-daily-bot"
            git config user.email "easy.automate2024@gmail.com"
            git commit -m "$MSG"
            git push
          fi
