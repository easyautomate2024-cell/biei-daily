name: その朝の予報を記録

on:
  schedule:
    # 毎日 05:10 JST。火山ワークフローが毎時00分に走るので、10分ずらして
    # 同じ瞬間に push がぶつからないようにしている
    - cron: "10 20 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: forecast-log
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 予報を記録
        run: python scripts/log_forecast.py

      - name: 記録が増えていればコミット
        run: |
          git add data/forecast-log.jsonl
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git config user.name "biei-daily-bot"
            git config user.email "easy.automate2024@gmail.com"
            git commit -m "その朝の予報を記録"
            git pull --rebase --autostash
            git push
          fi
