name: IG投稿(承認後)

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  publish:
    # [IG投稿案] のIssueに、リポジトリ所有者本人が「OK」とコメントしたときだけ動く
    if: >
      startsWith(github.event.issue.title, '[IG投稿案]') &&
      github.event.comment.user.login == 'easyautomate2024-cell' &&
      (startsWith(github.event.comment.body, 'OK') ||
       startsWith(github.event.comment.body, 'ok') ||
       startsWith(github.event.comment.body, '承認'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # 別アカウントのトークンが入っていたら、ここで止めて投稿しない
      - name: トークンのアカウントを確認
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, urllib.error, urllib.request
          url = ("https://graph.instagram.com/v23.0/me?fields=username"
                 "&access_token=" + os.environ["IG_ACCESS_TOKEN"])
          try:
              with urllib.request.urlopen(url, timeout=30) as r:
                  name = json.loads(r.read()).get("username")
          except urllib.error.HTTPError as e:
              print("エラー:", json.loads(e.read()).get("error", {}).get("message"))
              raise SystemExit(1)
          print(f"アカウント: @{name}")
          if name != "biei_explorer":
              print("想定(@biei_explorer)と違うアカウントのため、投稿を中止します")
              raise SystemExit(1)
          PY

      - name: Instagramへ投稿
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: python scripts/ig_publish.py

      # トークンは60日で切れる。投稿のたびに延長し、新しいトークンで秘密情報を上書きする。
      # GH_PAT(secrets管理権限つき)が未設定の間は延長だけ行い、期限を出力する
      - name: アクセストークンを延長
        if: always()
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          RES=$(curl -s "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=${IG_ACCESS_TOKEN}")
          NEW=$(echo "$RES" | python -c "import json,sys; d=json.load(sys.stdin); print(d.get('access_token',''))")
          DAYS=$(echo "$RES" | python -c "import json,sys; d=json.load(sys.stdin); print(d.get('expires_in',0)//86400)")
          if [ -z "$NEW" ]; then echo "延長に失敗(発行から24時間以内は延長できない): $RES"; exit 0; fi
          if [ "$NEW" = "$IG_ACCESS_TOKEN" ]; then
            echo "トークンを延長しました(残り${DAYS}日・文字列は同じなので保存は不要)"
          elif [ -n "$GH_TOKEN" ]; then
            echo "$NEW" | gh secret set IG_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY"
            echo "新しいトークンを保存しました(残り${DAYS}日)"
          else
            echo "::warning::延長で新しいトークンが発行されましたが、GH_PAT 未設定のため保存できていません。今のトークンの期限前に再設定が必要です"
          fi
