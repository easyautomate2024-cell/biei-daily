name: 1年のタイムラプスを更新

on:
  schedule:
    - cron: "40 20 * * 0"   # 毎週月曜 05:40 JST
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: timelapse
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # 衛星画像の読み取りが固まったとき、デフォルトの6時間を走り切らせない
    timeout-minutes: 45
    env:
      GDAL_HTTP_MAX_RETRY: "3"
      GDAL_HTTP_RETRY_DELAY: "5"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存ライブラリ
        run: pip install --quiet rasterio pillow numpy

      # ubuntu-latest(24.04)のランナーに ffmpeg は入っていない。
      # 入れ忘れると動画の書き出しだけが落ちる(駒の生成までは成功する)ので注意。
      - name: ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      - name: 駒を追加して動画を作り直す
        run: python scripts/build_timelapse.py

      # 書き出しが失敗しても、そこまでに落とした駒は残して次回に引き継ぐ。
      # ジョブ自体は前の手順の失敗で red のままなので、失敗の通知は届く。
      - name: 変更があればコミット
        if: always()
        run: |
          git add photos/sat/tl photos/sat/timelapse.mp4 photos/sat/timelapse-poster.jpg data/timelapse.json
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            # from/to/count は書き出しに失敗した回では古いままなので、
            # メッセージは実際にコミットする駒の一覧から数える
            MSG=$(python -c "import json; fs=json.load(open('data/timelapse.json'))['frames']; print(f\"タイムラプス更新: {fs[0]['date']}〜{fs[-1]['date']}（{len(fs)}駒）\")")
            git config user.name "biei-daily-bot"
            git config user.email "easy.automate2024@gmail.com"
            git commit -m "$MSG"
            git pull --rebase
            git push
          fi
