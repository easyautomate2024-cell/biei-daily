name: IGトークン確認

# 投稿はせず、保存されているトークンがどのアカウントのものかだけを確かめる
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: トークンのアカウントを確認
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, urllib.error, urllib.request
          url = ("https://graph.instagram.com/v23.0/me?fields=user_id,username,account_type,media_count"
                 "&access_token=" + os.environ["IG_ACCESS_TOKEN"])
          try:
              with urllib.request.urlopen(url, timeout=30) as r:
                  d = json.loads(r.read())
          except urllib.error.HTTPError as e:
              print("エラー:", json.loads(e.read()).get("error", {}).get("message"))
              raise SystemExit(1)
          print(f"アカウント: @{d.get('username')} / 種類: {d.get('account_type')} / 投稿数: {d.get('media_count')}")
          if d.get("username") != "biei_explorer":
              print("想定(@biei_explorer)と違うアカウントです")
              raise SystemExit(1)
          PY
