name: IGトークンを非公開リポジトリへ移す(一回だけ)

# 移し先(非公開リポジトリ biei-ig)の公開鍵で、その秘密情報の保管庫でしか開けない形に
# 暗号化して出力する。平文のトークンはどこにも出さない。移し終えたらこのファイルは消す。
on:
  workflow_dispatch:
    inputs:
      key:
        description: 移し先リポジトリの Actions 公開鍵(base64)
        required: true

permissions:
  contents: read

jobs:
  seal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 移し先の鍵で暗号化
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          DEST_KEY: ${{ inputs.key }}
        run: |
          pip install -q pynacl
          python - <<'PY'
          import base64, os
          from nacl.public import PublicKey, SealedBox
          box = SealedBox(PublicKey(base64.b64decode(os.environ["DEST_KEY"])))
          print("SEALED:" + base64.b64encode(box.encrypt(os.environ["IG_ACCESS_TOKEN"].encode())).decode())
          PY
