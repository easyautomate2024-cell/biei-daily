name: IG投稿案を起票

on:
  schedule:
    - cron: "0 23 * * 6"   # 毎週日曜 08:00 JST
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 投稿案をIssueにする
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/ig_weekly_draft.py
